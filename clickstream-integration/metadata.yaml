      - added PPT graceful fallback with conversion request
      - added confidence scoring for PDF/PPTX extraction
      - updated clickstream-config.json with pdf/pptx/ppt entries
      - updated parser-config.json with pdf/pptx/ppt parser definitions
      - updated parse-clickstream-sheet.js with parsePdf/parsePptx/parsePpt handlers
      - detect-clickstream-sheet.js requires no changes (config-driven)
      - normalize-events.js requires no changes (format-agnostic pipeline)
      - updated SKILL.md with supported formats, PDF/PPTX safety rules, PPT fallback rule
      - updated readme.md with format guidance sections
